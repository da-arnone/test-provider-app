services:
  provider-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - ./.env
    ports:
      - "${PROVIDER_BACKEND_PORT:-8002}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: dev_project.settings
      FRONTEND_URL: "http://localhost:${PROVIDER_FRONTEND_PORT:-3002}"
      AUTH_APP_URL: "${AUTH_APP_URL:-http://host.docker.internal:8001}"
      SUBSCRIPTION_APP_URL: "${SUBSCRIPTION_APP_URL:-http://host.docker.internal:8003}"
  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm start"
    volumes:
      - .:/app
      - provider_frontend_node_modules:/app/frontend/node_modules
    environment:
      BACKEND_URL: http://provider-app:8000
    depends_on:
      - provider-app
    ports:
      - "${PROVIDER_FRONTEND_PORT:-3002}:3002"

volumes:
  provider_frontend_node_modules: